name: Deploy Warriors demo to GitHub Pages

# Publishes the static "Warrior's Path" demo (the warriors/ folder) for this
# branch. The site uses only relative links, so it works under the /Claude/
# Pages base path with no build step.

on:
  push:
    branches: [claude/awesome-ptolemy-9m89lv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: warriors
      - uses: actions/deploy-pages@v4
        id: deployment
