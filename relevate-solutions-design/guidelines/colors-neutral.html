<!-- @dsCard group="Colors" viewport="700x220" subtitle="Neutrals & tints" name="Neutral & Tint Palette" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px}
  .sw{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
  .chip{height:70px}
  .meta{padding:10px 12px;font-size:12.5px;color:var(--text-muted)}
  .meta b{display:block;font-family:var(--font-heading);font-size:14px;color:var(--text-heading)}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#55677A"></div><div class="meta"><b>Slate</b>#55677A</div></div>
  <div class="sw"><div class="chip" style="background:#D5DEE6"></div><div class="meta"><b>Silver</b>#D5DEE6</div></div>
  <div class="sw"><div class="chip" style="background:#F5F8FA;border-bottom:1px solid #eee"></div><div class="meta"><b>Cloud</b>#F5F8FA</div></div>
  <div class="sw"><div class="chip" style="background:#E3F4FC"></div><div class="meta"><b>Sky Wash</b>#E3F4FC</div></div>
</div>
