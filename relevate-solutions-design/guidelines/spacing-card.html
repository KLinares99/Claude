<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Card padding, grid gap, corner radii" name="Card Anatomy" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cloud);padding:20px;display:flex;gap:16px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:30px;box-shadow:var(--shadow);flex:1}
  .card h4{font-family:var(--font-heading);font-size:15px;color:var(--text-heading);margin:0 0 6px}
  .card p{font-size:12.5px;color:var(--text-muted);margin:0}
</style>
<div class="card"><h4>14px radius</h4><p>30px padding · 1px silver border · shadow on hover</p></div>
<div class="card"><h4>22px grid gap</h4><p>Standard gap between sibling cards in a grid</p></div>
