<!-- @dsCard group="Colors" viewport="700x220" subtitle="Primary brand — navy & cyan" name="Primary Palette" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px}
  .sw{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
  .chip{height:70px}
  .meta{padding:10px 12px;font-size:12.5px;color:var(--text-muted)}
  .meta b{display:block;font-family:var(--font-heading);font-size:14px;color:var(--text-heading)}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#0A2540"></div><div class="meta"><b>Midnight Navy</b>#0A2540</div></div>
  <div class="sw"><div class="chip" style="background:#0B4E86"></div><div class="meta"><b>Relevate Navy</b>#0B4E86</div></div>
  <div class="sw"><div class="chip" style="background:#21AEE4"></div><div class="meta"><b>Elevation Cyan</b>#21AEE4</div></div>
  <div class="sw"><div class="chip" style="background:#E8B54D"></div><div class="meta"><b>Stewardship Gold</b>#E8B54D</div></div>
</div>
